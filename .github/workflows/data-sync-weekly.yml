name: Weekly reference data sync

on:
  schedule:
    # 06:43 UTC each Sunday. Court reference work shares the CourtListener lock.
    - cron: "43 6 * * 0"
  workflow_dispatch:
    inputs:
      fec_only:
        description: Run only the FEC import (leave reference data alone)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-reference-data:
    name: Sync reference data
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.fec_only }}
    concurrency:
      group: govsource-courtlistener
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      COURT_LISTENER_API_KEY: ${{ secrets.COURT_LISTENER_API_KEY }}
    defaults:
      run:
        working-directory: services/data-sync

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt

      - name: Install dependencies
        run: pip install -r requirements.runtime.txt

      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CONGRESS_API_KEY COURT_LISTENER_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      # Courts must exist before opinion rows can resolve their court_id.
      - name: Sync courts
        run: |
          if [[ "${{ vars.BRIEF_PIPELINE_ENABLED }}" == "true" ]]; then
            python scripts/run_pipeline_source.py --reference courtlistener
          else
            python scripts/sync_courts.py --per-page 100 --page-limit 40
          fi

      - name: Sync Congress members
        run: python scripts/sync_members_supabase.py --limit -1 --max-batches 10

      - name: Sync Federal Register agencies
        run: python scripts/sync_agencies.py

      - name: Reconcile agency relationships
        run: python scripts/update_agency_relationships.py

  sync-fec-donations:
    name: Sync direct committee contributions
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: govsource-fec
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/data-sync
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      FEC_MAX_API_REQUESTS: '2200'
      FEC_MINIMUM_REQUEST_INTERVAL: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt
      - run: pip install -r requirements.runtime.txt
      - name: Verify FEC secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY FEC_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"
      # FEC candidate IDs include challengers; no dependency on member ingestion.
      - name: Import current reporting period
        run: python scripts/sync_fec_donations.py --write
