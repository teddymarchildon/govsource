name: Weekly reference data sync

on:
  schedule:
    # 06:43 UTC each Sunday. The shared concurrency group queues it behind daily work.
    - cron: "43 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govsource-data-sync
  cancel-in-progress: false

jobs:
  sync-reference-data:
    name: Sync reference data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      COURT_LISTENER_API_KEY: ${{ secrets.COURT_LISTENER_API_KEY }}
    defaults:
      run:
        working-directory: services/data-sync

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt

      - name: Install dependencies
        run: pip install -r requirements.runtime.txt

      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CONGRESS_API_KEY COURT_LISTENER_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      # Courts must exist before opinion rows can resolve their court_id.
      - name: Sync courts
        run: python scripts/sync_courts.py --per-page 100 --page-limit 40

      - name: Sync Congress members
        run: python scripts/sync_members_supabase.py --limit -1 --max-batches 10

      - name: Sync Federal Register agencies
        run: python scripts/sync_agencies.py

      - name: Reconcile agency relationships
        run: python scripts/update_agency_relationships.py
