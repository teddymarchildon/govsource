name: Generate and verify briefs

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_run:
    workflows: [Sync Federal Register records, Sync changed Congress records]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      queue:
        description: Process current developments or historical backfill
        type: choice
        default: current
        options: [current, backfill]

permissions:
  contents: read

concurrency:
  group: govsource-brief-processing
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.BRIEF_PIPELINE_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/data-sync
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BRIEF_MODEL: ${{ vars.OPENAI_BRIEF_MODEL || 'gpt-5-mini' }}
      OPENAI_BRIEF_VERIFIER_MODEL: ${{ vars.OPENAI_BRIEF_VERIFIER_MODEL || 'gpt-5-mini' }}
      BRIEF_PRICING_MODELS: ${{ vars.BRIEF_PRICING_MODELS || 'gpt-5-mini' }}
      BRIEF_INPUT_USD_PER_MILLION: ${{ vars.BRIEF_INPUT_USD_PER_MILLION || '0.25' }}
      BRIEF_OUTPUT_USD_PER_MILLION: ${{ vars.BRIEF_OUTPUT_USD_PER_MILLION || '2.00' }}
      BRIEF_QUEUE: ${{ inputs.queue || 'current' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt
      - run: pip install -r requirements.runtime.txt
      - name: Publish already verified results
        run: python scripts/process_briefs.py --publish-only --limit 30
      - name: Process durable jobs and publish only verified results
        run: python scripts/run_pipeline_source.py processor -- --limit 25 --max-minutes 20 --workers 2 --queue "$BRIEF_QUEUE"
      - name: Publish verified results even after an individual job fails
        if: ${{ always() && !cancelled() }}
        run: python scripts/process_briefs.py --publish-only --limit 30
