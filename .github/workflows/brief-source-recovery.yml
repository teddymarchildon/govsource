name: Recover older Federal Register content

on:
  schedule:
    - cron: "19 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govsource-federal-register
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.BRIEF_PIPELINE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/data-sync
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt
      - run: pip install -r requirements.runtime.txt
      - name: Advance the persistent recovery scan
        run: python scripts/run_pipeline_source.py --recovery federal_register
