name: Daily data sync

on:
  schedule:
    # Avoid the top of the hour, when scheduled Actions are most likely to queue.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The weekly workflow uses the same group so two sync processes never write at once.
concurrency:
  group: govsource-data-sync
  cancel-in-progress: false

jobs:
  sync-recent-data:
    name: Sync recent government data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      COURT_LISTENER_API_KEY: ${{ secrets.COURT_LISTENER_API_KEY }}
    defaults:
      run:
        working-directory: services/data-sync

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt

      - name: Install dependencies
        run: pip install -r requirements.runtime.txt

      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CONGRESS_API_KEY COURT_LISTENER_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Sync recent bills
        run: python scripts/sync_bills_supabase.py --limit 100

      - name: Refresh actions for recent bills
        run: python scripts/sync_bill_actions_supabase.py --limit 250

      - name: Sync recent Federal Register documents
        shell: bash
        run: |
          for document_type in RULE PRORULE NOTICE PRESDOCU; do
            python scripts/sync_federal_register_docs.py \
              --document-type "${document_type}" \
              --per-page 100 \
              --max-pages 2
          done

      - name: Sync recent Supreme Court opinions
        run: >-
          python scripts/sync_court_opinions.py
          --court-id scotus
          --per-page 20
          --max-pages 5
