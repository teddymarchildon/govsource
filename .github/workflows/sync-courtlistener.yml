name: Sync Supreme Court opinions

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govsource-courtlistener
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.BRIEF_PIPELINE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/data-sync
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COURT_LISTENER_API_KEY: ${{ secrets.COURT_LISTENER_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt
      - run: pip install -r requirements.runtime.txt
      - name: Sync opinions within the shared daily allowance
        run: python scripts/run_pipeline_source.py courtlistener
