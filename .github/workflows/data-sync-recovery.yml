name: Recover Federal Register documents

on:
  workflow_dispatch:
    inputs:
      document_numbers:
        description: Space-separated document numbers to recover (for example X26-20831 X26-10831)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: govsource-federal-register
  cancel-in-progress: false

jobs:
  recover-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BRIEF_PIPELINE_ENABLED: ${{ vars.BRIEF_PIPELINE_ENABLED }}
      DOCUMENT_NUMBERS: ${{ inputs.document_numbers }}
    defaults:
      run:
        working-directory: services/data-sync
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-sync/requirements.runtime.txt
      - name: Install dependencies
        run: pip install -r requirements.runtime.txt
      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"
      - name: Recover requested documents
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          numbers = list(dict.fromkeys(os.environ["DOCUMENT_NUMBERS"].split()))
          if not 1 <= len(numbers) <= 100 or any(
              not re.fullmatch(r"[A-Za-z0-9]+-[A-Za-z0-9]+", number)
              for number in numbers
          ):
              sys.exit("Provide 1–100 space-separated document numbers.")
          command = ([sys.executable, "scripts/run_pipeline_source.py", "federal_register"]
                     if os.environ.get("BRIEF_PIPELINE_ENABLED") == "true"
                     else [sys.executable, "scripts/sync_federal_register_docs.py"])
          for number in numbers:
              command.extend(["--document-number", number])
          subprocess.run(command, check=True)
          PY
