[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Enable SQLAlchemy plugin
[mypy.plugins.sqlalchemy.mypy_sqlalchemy_plugin]
enabled = True

# Exclude all model files
[mypy.app.models]
ignore_errors = True

# Specific exclusions for model files
[mypy.app.models.congress]
ignore_errors = True

# Exclude specific files
[mypy-app.models.*]
ignore_errors = True

# Ignore errors in SQLAlchemy-related code
[mypy-sqlalchemy.*]
ignore_missing_imports = True
